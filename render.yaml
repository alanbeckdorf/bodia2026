services:
  - type: web
    name: bodia-backoffice
    env: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    autoDeploy: true
    disk:
      name: bodia-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
